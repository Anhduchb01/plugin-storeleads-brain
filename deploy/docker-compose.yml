# storeleads-brain on the ecvision host, next to storeleads-clickhouse and storeleads-grafana.
# Reached from the internet only through the Cloudflare tunnel: storeleads-brain.ecvision.ai → http://localhost:3210 (BRAIN_PORT)
services:
  brain:
    build: ..
    image: storeleads-brain:latest
    container_name: storeleads-brain
    restart: unless-stopped
    # Must be able to read tokens/tokens.txt (mode 600, owned by the deploying user). setup.sh writes BRAIN_USER:
    # 0:0 under rootless Docker (container root = that host user), else the host uid:gid.
    user: "${BRAIN_USER:-node}"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "8080"
      CLICKHOUSE_URL: http://storeleads-clickhouse:8123
      TOKENS_FILE: /run/brain/tokens.txt
    ports:
      - "127.0.0.1:${BRAIN_PORT:-3210}:8080"
    volumes:
      # A directory, not the file: editors and sed -i replace the file, which a single-file mount would not see.
      - ./tokens:/run/brain:ro
    mem_limit: 512m
    networks: [clickhouse_default]
networks:
  clickhouse_default:
    external: true
